name: Fix OG preview spacing

on:
  push:
    paths:
      - ".github/workflows/fix-og-spacing.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install pillow fonttools

      - name: Rebuild preview images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from fontTools.ttLib import TTFont

          BG=(13,14,17)
          WHITE=(237,239,244)
          GRAY=(153,158,170)

          # Convert the existing Android 7 WOFF to a temporary TTF that Pillow can draw.
          ft=TTFont("assets/android-7.woff")
          ft.flavor=None
          ttf="/tmp/android7.ttf"
          ft.save(ttf)

          # 6to-grado is our intact template: preserve the exact institutional
          # header, background and red footer, and rebuild only the grade artwork.
          template=Image.open("assets/og/6to-grado.png").convert("RGB")
          template_draw=ImageDraw.Draw(template)

          previews={
              "1er-grado":("PRIMER","grado"),
              "2do-grado":("SEGUNDO","grado"),
              "3er-grado":("TERCER","grado"),
              "4to-grado":("CUARTO","grado"),
              "5to-grado":("QUINTO","grado"),
              "6to-grado":("SEXTO","grado"),
              "1er-ano":("PRIMER","año"),
              "2do-ano":("SEGUNDO","año"),
              "3er-ano":("TERCER","año"),
              "4to-ano":("CUARTO","año"),
              "5to-ano":("QUINTO","año"),
          }

          probe=ImageDraw.Draw(Image.new("RGB",(2,2)))

          def fit_font(text, max_size=84, max_width=430):
              size=max_size
              while size>12:
                  font=ImageFont.truetype(ttf,size)
                  if probe.textlength(text,font=font) <= max_width:
                      return font
                  size-=1
              return ImageFont.truetype(ttf,size)

          for slug,(main,label) in previews.items():
              im=template.copy()
              d=ImageDraw.Draw(im)

              # Clear only the typography area. The header and red bar stay untouched.
              d.rectangle((0,88,599,279),fill=BG)

              main_font=fit_font(main)
              main_bbox=d.textbbox((0,0),main,font=main_font)
              main_w=d.textlength(main,font=main_font)
              main_x=(600-main_w)/2
              main_top=112
              d.text((main_x,main_top-main_bbox[1]),main,font=main_font,fill=WHITE)

              label_text="ano" if label=="año" else "GRADO"
              label_font=ImageFont.truetype(ttf,44)
              label_bbox=d.textbbox((0,0),label_text,font=label_font)
              label_w=d.textlength(label_text,font=label_font)
              label_x=(600-label_w)/2

              # Bring the second word substantially closer to the first one.
              label_top=187
              d.text((label_x,label_top-label_bbox[1]),label_text,font=label_font,fill=GRAY)

              if label=="año":
                  # The font has no ñ. Draw a short tilde immediately above the n,
                  # rather than leaving the old detached dash high above the word.
                  before_n=d.textlength("a",font=label_font)
                  n_width=d.textlength("n",font=label_font)
                  n_center=label_x+before_n+(n_width/2)
                  d.rounded_rectangle(
                      (n_center-6,label_top-7,n_center+6,label_top-5),
                      radius=1,
                      fill=GRAY
                  )

              im.save(Path("assets/og")/(slug+".png"), optimize=True)

          PY

      - name: Commit corrected previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Corregir composición de previews Open Graph"
          git push
