name: Fix OG preview spacing

on:
  push:
    paths:
      - ".github/workflows/fix-og-spacing.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install pillow cairosvg

      - name: Rebuild preview images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from io import BytesIO
          import cairosvg, json, re

          BG=(13,14,17)
          GRAY=(153,158,170)

          # Reuse the exact vector paths already embedded in the site itself.
          html=Path("index.html").read_text(encoding="utf-8")
          marker="const ANDROID7_WORDS="
          start=html.index(marker)+len(marker)
          depth=0
          end=None
          for pos,ch in enumerate(html[start:],start=start):
              if ch=="{":
                  depth+=1
              elif ch=="}":
                  depth-=1
                  if depth==0:
                      end=pos+1
                      break
          if end is None:
              raise RuntimeError("ANDROID7_WORDS object did not close")
          words=json.loads(html[start:end])

          # This image is intact and serves only as the institutional shell:
          # header, background and red footer.
          template=Image.open("assets/og/6to-grado.png").convert("RGB")

          previews={
              "1er-grado":("Primer","grado"),
              "2do-grado":("Segundo","grado"),
              "3er-grado":("Tercer","grado"),
              "4to-grado":("Cuarto","grado"),
              "5to-grado":("Quinto","grado"),
              "6to-grado":("Sexto","grado"),
              "1er-ano":("Primer","ano"),
              "2do-ano":("Segundo","ano"),
              "3er-ano":("Tercer","ano"),
              "4to-ano":("Cuarto","ano"),
              "5to-ano":("Quinto","ano"),
          }

          def render_word(key, max_w, max_h, color):
              item=words[key]
              scale=min(max_w/item["w"], max_h/item["h"])
              out_w=max(1,round(item["w"]*scale))
              out_h=max(1,round(item["h"]*scale))
              rgb="#%02x%02x%02x" % color
              svg=f'''<svg xmlns="http://www.w3.org/2000/svg"
                  width="{out_w}" height="{out_h}"
                  viewBox="0 0 {item["w"]} {item["h"]}">
                  <g transform="translate(0 {item["h"]}) scale(1 -1)">
                    <path d="{item["d"]}" fill="{rgb}"/>
                  </g>
              </svg>'''
              data=cairosvg.svg2png(
                  bytestring=svg.encode("utf-8"),
                  output_width=out_w,
                  output_height=out_h
              )
              return Image.open(BytesIO(data)).convert("RGBA")

          for slug,(main_key,label_key) in previews.items():
              im=template.copy()
              d=ImageDraw.Draw(im)

              # Rebuild only the central grade artwork.
              d.rectangle((0,88,599,279), fill=BG)

              main=render_word(main_key,430,50,(237,239,244))
              mx=(600-main.width)//2
              my=114
              im.paste(main,(mx,my),main)

              # Reduce the excessive gap between the two words.
              label=render_word(label_key,170 if label_key=="grado" else 100,27,GRAY)
              lx=(600-label.width)//2
              ly=190
              im.paste(label,(lx,ly),label)

              if label_key=="ano":
                  # The custom alphabet does not include ñ. Put the short mark
                  # immediately above the n, not detached high above the word.
                  cx=round(lx + label.width*0.48)
                  d.rounded_rectangle(
                      (cx-6,ly-7,cx+6,ly-5),
                      radius=1,
                      fill=GRAY
                  )

              im.save(Path("assets/og")/(slug+".png"), optimize=True)

          PY

      - name: Commit corrected previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Corregir composición de previews Open Graph"
          git push
