name: Fix OG preview spacing

on:
  push:
    paths:
      - ".github/workflows/fix-og-spacing.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Adjust preview typography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          BG=(13,14,17)
          GRAY=(153,158,170)
          SHIFT=24

          for path in sorted(Path("assets/og").glob("*.png")):
              im=Image.open(path).convert("RGB")
              px=im.load()
              w,h=im.size

              lower=[]
              dash=[]

              for y in range(h):
                  for x in range(w):
                      if px[x,y] != GRAY:
                          continue
                      if y >= 210:
                          lower.append((x,y))
                      elif "-ano" in path.stem and 180 <= y < 210:
                          dash.append((x,y))

              if not lower:
                  continue

              for x,y in lower:
                  px[x,y]=BG
              for x,y in lower:
                  px[x,y-SHIFT]=GRAY

              if dash:
                  for x,y in dash:
                      px[x,y]=BG
                  lower_top=min(y for _,y in lower)-SHIFT
                  dash_top=min(y for _,y in dash)
                  target_top=lower_top-8
                  for x,y in dash:
                      px[x,target_top+(y-dash_top)]=GRAY

              im.save(path, optimize=True)
          PY

      - name: Commit corrected previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Corregir espaciado de previews Open Graph"
          git push
