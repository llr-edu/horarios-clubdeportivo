name: Generate discipline previews

on:
  push:
    paths:
      - ".github/workflows/generate-discipline-previews.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install pillow
          curl -L --fail --silent --show-error             "https://raw.githubusercontent.com/google/fonts/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf"             -o /tmp/orbitron.ttf || true

      - name: Generate discipline pages and preview images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import unicodedata, re

          ROOT="https://llr-edu.github.io/horarios-clubdeportivo/"
          BG=(13,14,17)
          WHITE=(237,239,244)
          GRAY=(153,158,170)

          disciplines=[
              "Ajedrez",
              "Astronomía",
              "Atletismo",
              "Bajo Eléctrico",
              "Baloncesto",
              "Béisbol",
              "Cuatro",
              "Encuentros deportivos",
              "Ensamble Musical",
              "Fútbol campo",
              "Futsal",
              "Gaita",
              "Guitarra Acústica",
              "Guitarra Eléctrica",
              "Iniciación Musical",
              "Karate",
              "Percusión",
              "Robótica",
              "Teclado",
              "Tenis",
              "Violín",
              "Voleibol",
          ]

          def slug(text):
              s=unicodedata.normalize("NFD",text)
              s="".join(ch for ch in s if unicodedata.category(ch)!="Mn")
              s=s.lower()
              s=re.sub(r"[^a-z0-9]+","-",s).strip("-")
              return s

          template=Image.open("assets/og/general.png").convert("RGB")
          out_img=Path("assets/og/disciplines")
          out_img.mkdir(parents=True,exist_ok=True)

          futuristic=Path("/tmp/orbitron.ttf")
          fallback="/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
          regular="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          display_font=str(futuristic) if futuristic.exists() else fallback

          def fit(draw,text,max_width,max_size=58,min_size=25):
              for size in range(max_size,min_size-1,-1):
                  font=ImageFont.truetype(display_font,size)
                  box=draw.textbbox((0,0),text,font=font)
                  if box[2]-box[0] <= max_width:
                      return font
              return ImageFont.truetype(display_font,min_size)

          def split_balanced(text):
              words=text.split()
              if len(words)<=1:
                  return [text]
              best=None
              for i in range(1,len(words)):
                  a=" ".join(words[:i]); b=" ".join(words[i:])
                  score=abs(len(a)-len(b))
                  if best is None or score<best[0]:
                      best=(score,a,b)
              return [best[1],best[2]]

          for name in disciplines:
              s=slug(name)
              im=template.copy()
              d=ImageDraw.Draw(im)

              # Keep the institutional header and red footer from the general card.
              d.rectangle((0,88,599,279),fill=BG)

              title=name.upper()
              font=fit(d,title,500)
              box=d.textbbox((0,0),title,font=font)
              width=box[2]-box[0]

              lines=[title]
              if width>500 or len(title)>20:
                  lines=split_balanced(title)

              if len(lines)==1:
                  font=fit(d,lines[0],500,60,27)
                  box=d.textbbox((0,0),lines[0],font=font)
                  x=(600-(box[2]-box[0]))/2
                  y=129-box[1]
                  d.text((x,y),lines[0],font=font,fill=WHITE)
              else:
                  fonts=[fit(d,line,500,48,24) for line in lines]
                  tops=[119,166]
                  for line,font,top in zip(lines,fonts,tops):
                      box=d.textbbox((0,0),line,font=font)
                      x=(600-(box[2]-box[0]))/2
                      d.text((x,top-box[1]),line,font=font,fill=WHITE)

              sub="TODOS LOS GRADOS"
              sf=ImageFont.truetype(bold,15)
              box=d.textbbox((0,0),sub,font=sf)
              d.text(((600-(box[2]-box[0]))/2,226),sub,font=sf,fill=GRAY)

              year="2026 · 2027"
              yf=ImageFont.truetype(regular,12)
              box=d.textbbox((0,0),year,font=yf)
              d.text(((600-(box[2]-box[0]))/2,250),year,font=yf,fill=GRAY)

              im.save(out_img/(s+".png"),optimize=True)

              title_meta=f"Horario · {name} | Club Deportivo LL. RR."
              desc=f"{name} · Horarios por grado y día · LL. RR. 2026-2027"
              page_url=f"{ROOT}disciplina/{s}/"
              image_url=f"{ROOT}assets/og/disciplines/{s}.png"

              page=f"""<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{title_meta}</title>
<meta name="description" content="{desc}">
<link rel="canonical" href="{page_url}">
<link rel="image_src" href="{image_url}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Club Deportivo LL. RR.">
<meta property="og:title" content="{title_meta}">
<meta property="og:description" content="{desc}">
<meta property="og:url" content="{page_url}">
<meta property="og:image" content="{image_url}">
<meta property="og:image:secure_url" content="{image_url}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="315">
<meta property="og:image:alt" content="{title_meta}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{title_meta}">
<meta name="twitter:description" content="{desc}">
<meta name="twitter:image" content="{image_url}">
<script>
(function(){{
  var p=new URLSearchParams(location.search);
  p.set("disciplina","{s}");
  location.replace("../../?"+p.toString());
}})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=../../?disciplina={s}"></noscript>
</head>
<body></body>
</html>"""
              page_path=Path("disciplina")/s/"index.html"
              page_path.parent.mkdir(parents=True,exist_ok=True)
              page_path.write_text(page,encoding="utf-8")
          PY

      - name: Commit discipline previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disciplina assets/og/disciplines
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Añadir previews Open Graph por disciplina"
          git push
