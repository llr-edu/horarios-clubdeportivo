name: Generate discipline previews

on:
  push:
    paths:
      - ".github/workflows/generate-discipline-previews.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install pillow
          curl -L --fail --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf" -o /tmp/orbitron.ttf || true

      - name: Generate discipline pages and preview images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import unicodedata, re

          ROOT="https://llr-edu.github.io/horarios-clubdeportivo/"
          BG=(13,14,17)
          WHITE=(237,239,244)
          GRAY=(153,158,170)

          disciplines=[
              "Ajedrez","Astronomía","Atletismo","Bajo Eléctrico","Baloncesto",
              "Béisbol","Cuatro","Encuentros deportivos","Ensamble Musical",
              "Fútbol campo","Futsal","Gaita","Guitarra Acústica",
              "Guitarra Eléctrica","Iniciación Musical","Karate","Percusión",
              "Robótica","Teclado","Tenis","Violín","Voleibol"
          ]

          def slug(text):
              s=unicodedata.normalize("NFD",text)
              s="".join(ch for ch in s if unicodedata.category(ch)!="Mn")
              s=re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")
              return s

          template=Image.open("assets/og/general.png").convert("RGB")
          out_img=Path("assets/og/disciplines")
          out_img.mkdir(parents=True,exist_ok=True)

          futuristic=Path("/tmp/orbitron.ttf")
          fallback="/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
          regular="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          display_font=str(futuristic) if futuristic.exists() else fallback

          def fit(draw,text,max_width,max_size=58,min_size=25):
              for size in range(max_size,min_size-1,-1):
                  font=ImageFont.truetype(display_font,size)
                  box=draw.textbbox((0,0),text,font=font)
                  if box[2]-box[0] <= max_width:
                      return font
              return ImageFont.truetype(display_font,min_size)

          def split_balanced(text):
              words=text.split()
              if len(words)<=1:
                  return [text]
              choices=[]
              for i in range(1,len(words)):
                  a=" ".join(words[:i]); b=" ".join(words[i:])
                  choices.append((abs(len(a)-len(b)),a,b))
              _,a,b=min(choices,key=lambda x:x[0])
              return [a,b]

          for name in disciplines:
              s=slug(name)
              im=template.copy()
              d=ImageDraw.Draw(im)
              d.rectangle((0,88,599,279),fill=BG)

              title=name.upper()
              font=fit(d,title,500)
              box=d.textbbox((0,0),title,font=font)
              width=box[2]-box[0]
              lines=[title] if width<=500 and len(title)<=20 else split_balanced(title)

              if len(lines)==1:
                  font=fit(d,lines[0],500,60,27)
                  box=d.textbbox((0,0),lines[0],font=font)
                  x=(600-(box[2]-box[0]))/2
                  d.text((x,129-box[1]),lines[0],font=font,fill=WHITE)
              else:
                  for line,top in zip(lines,[119,166]):
                      font=fit(d,line,500,48,24)
                      box=d.textbbox((0,0),line,font=font)
                      x=(600-(box[2]-box[0]))/2
                      d.text((x,top-box[1]),line,font=font,fill=WHITE)

              sub="TODOS LOS GRADOS"
              sf=ImageFont.truetype(bold,15)
              box=d.textbbox((0,0),sub,font=sf)
              d.text(((600-(box[2]-box[0]))/2,226),sub,font=sf,fill=GRAY)

              year="2026 · 2027"
              yf=ImageFont.truetype(regular,12)
              box=d.textbbox((0,0),year,font=yf)
              d.text(((600-(box[2]-box[0]))/2,250),year,font=yf,fill=GRAY)

              im.save(out_img/(s+".png"),optimize=True)

              title_meta=f"Horario · {name} | Club Deportivo LL. RR."
              desc=f"{name} · Horarios por grado y día · LL. RR. 2026-2027"
              page_url=f"{ROOT}disciplina/{s}/"
              image_url=f"{ROOT}assets/og/disciplines/{s}.png"

              page=(
                  "<!doctype html>\n"
                  "<html lang=\"es\">\n"
                  "<head>\n"
                  "<meta charset=\"utf-8\">\n"
                  "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
                  f"<title>{title_meta}</title>\n"
                  f"<meta name=\"description\" content=\"{desc}\">\n"
                  f"<link rel=\"canonical\" href=\"{page_url}\">\n"
                  f"<link rel=\"image_src\" href=\"{image_url}\">\n"
                  "<meta property=\"og:type\" content=\"website\">\n"
                  "<meta property=\"og:site_name\" content=\"Club Deportivo LL. RR.\">\n"
                  f"<meta property=\"og:title\" content=\"{title_meta}\">\n"
                  f"<meta property=\"og:description\" content=\"{desc}\">\n"
                  f"<meta property=\"og:url\" content=\"{page_url}\">\n"
                  f"<meta property=\"og:image\" content=\"{image_url}\">\n"
                  f"<meta property=\"og:image:secure_url\" content=\"{image_url}\">\n"
                  "<meta property=\"og:image:type\" content=\"image/png\">\n"
                  "<meta property=\"og:image:width\" content=\"600\">\n"
                  "<meta property=\"og:image:height\" content=\"315\">\n"
                  f"<meta property=\"og:image:alt\" content=\"{title_meta}\">\n"
                  "<meta name=\"twitter:card\" content=\"summary_large_image\">\n"
                  f"<meta name=\"twitter:title\" content=\"{title_meta}\">\n"
                  f"<meta name=\"twitter:description\" content=\"{desc}\">\n"
                  f"<meta name=\"twitter:image\" content=\"{image_url}\">\n"
                  "<script>\n"
                  "(function(){\n"
                  "  var p=new URLSearchParams(location.search);\n"
                  f"  p.set(\"disciplina\",\"{s}\");\n"
                  "  location.replace(\"../../?\"+p.toString());\n"
                  "})();\n"
                  "</script>\n"
                  f"<noscript><meta http-equiv=\"refresh\" content=\"0;url=../../?disciplina={s}\"></noscript>\n"
                  "</head>\n"
                  "<body></body>\n"
                  "</html>\n"
              )
              page_path=Path("disciplina")/s/"index.html"
              page_path.parent.mkdir(parents=True,exist_ok=True)
              page_path.write_text(page,encoding="utf-8")
          PY

      - name: Commit discipline previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disciplina assets/og/disciplines
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Añadir previews Open Graph por disciplina"
          git push
