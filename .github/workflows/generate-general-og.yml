name: Generate general OG preview

on:
  push:
    paths:
      - ".github/workflows/generate-general-og.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install pillow cairosvg

      - name: Build general preview
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from io import BytesIO
          import cairosvg, json

          BG=(13,14,17)
          WHITE=(237,239,244)
          GRAY=(153,158,170)
          RED=(233,27,44)

          html=Path("index.html").read_text(encoding="utf-8")
          marker="const ANDROID7_WORDS="
          start=html.index(marker)+len(marker)

          depth=0
          end=None
          for pos,ch in enumerate(html[start:],start=start):
              if ch=="{":
                  depth+=1
              elif ch=="}":
                  depth-=1
                  if depth==0:
                      end=pos+1
                      break
          if end is None:
              raise RuntimeError("ANDROID7_WORDS object did not close")
          words=json.loads(html[start:end])

          # Use an existing preview as the institutional shell so the general
          # card keeps exactly the same header, background and footer treatment.
          template=Image.open("assets/og/6to-grado.png").convert("RGB")
          d=ImageDraw.Draw(template)
          d.rectangle((0,88,599,279),fill=BG)

          letters={
              "A":("ano",0,1200),
              "C":("Cuarto",0,1200),
              "D":("Segundo",7000,1200),
              "E":("Segundo",1400,1200),
              "I":("Primer",2800,200),
              "M":("Primer",3200,1400),
              "N":("Segundo",5600,1200),
              "O":("Segundo",8400,1200),
              "P":("Primer",0,1200),
              "R":("Primer",1400,1200),
              "S":("Segundo",0,1200),
              "T":("Tercer",0,1250),
              "U":("Segundo",4200,1200),
          }

          def word_markup(text, y, height, fill, center=300, gap=5):
              widths=[]
              for ch in text:
                  src,origin,w=letters[ch]
                  widths.append(w*(height/1200))
              total=sum(widths)+gap*(len(text)-1)
              x=center-total/2
              parts=[]
              boxes=[]
              for ch,pw in zip(text,widths):
                  src,origin,w=letters[ch]
                  item=words[src]
                  parts.append(
                      f'<svg x="{x:.2f}" y="{y}" width="{pw:.2f}" height="{height}" '
                      f'viewBox="{origin} 0 {w} 1200" overflow="hidden">'
                      f'<g transform="translate(0 1200) scale(1 -1)">'
                      f'<path d="{item["d"]}" fill="{fill}"/></g></svg>'
                  )
                  boxes.append((ch,x,pw))
                  x+=pw+gap
              return "".join(parts),boxes

          main,_=word_markup("DEPORTES",118,48,"#edefF4".lower(),gap=6)
          music,music_boxes=word_markup("MUSICA",188,29,"#999eaa",center=185,gap=4)
          science,_=word_markup("CIENCIAS",188,29,"#999eaa",center=415,gap=4)

          # Accent over the U in MÚSICA.
          ux=next(x+w/2 for ch,x,w in music_boxes if ch=="U")

          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280">
            {main}
            {music}
            {science}
            <rect x="{ux-5:.2f}" y="181" width="10" height="2" rx="1" fill="#999eaa"/>
          </svg>'''

          overlay=Image.open(BytesIO(cairosvg.svg2png(bytestring=svg.encode("utf-8")))).convert("RGBA")
          template.paste(overlay,(0,0),overlay)

          # Small supporting copy stays understated; the category words above
          # carry the Android 7 visual identity.
          draw=ImageDraw.Draw(template)
          regular="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          f1=ImageFont.truetype(bold,16)
          f2=ImageFont.truetype(regular,13)

          label="HORARIOS"
          box=draw.textbbox((0,0),label,font=f1)
          draw.text(((600-(box[2]-box[0]))/2,94),label,font=f1,fill=GRAY)

          year="2026 · 2027"
          box=draw.textbbox((0,0),year,font=f2)
          draw.text(((600-(box[2]-box[0]))/2,244),year,font=f2,fill=GRAY)

          template.save("assets/og/general.png", optimize=True)
          PY

      - name: Commit general preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/general.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Añadir preview general Open Graph"
          git push
