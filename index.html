function render(){const q=normal(textInput.value),filtered=DATA.filter(r=>(!selectedDay||r.day===selectedDay)&&(!selectedGrade||r.grade===selectedGrade)&&(!selectedDisc||r.disciplines.includes(selectedDisc))&&(!q||normal(r.day+" "+r.grade+" "+r.type+" "+r.disciplines.join(" ")).includes(q)));const groups=new Map();for(const r of filtered){if(!groups.has(r.grade))groups.set(r.grade,new Map());const bd=groups.get(r.grade);if(!bd.has(r.day))bd.set(r.day,new Set());r.disciplines.forEach(d=>bd.get(r.day).add(d))}results.innerHTML="";const gs=[...groups.keys()].sort((a,b)=>GRADE_ORDER.indexOf(a)-GRADE_ORDER.indexOf(b));for(const g of gs){const bd=groups.get(g),days=[...bd.keys()].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b)),card=document.createElement("article");card.className="card";card.dataset.grade=g;card.innerHTML="<h3>"+g+"</h3>"+days.map(day=>'<div class="meta"><span class="pill">'+day+'</span></div><div class="list">'+[...bd.get(day)].sort((a,b)=>a.localeCompare(b,"es")).map(d=>'<button class="tag" data-d="'+d+'">'+d+'</button>').join("")+"</div>").join("")+'<div class="card-actions"><button class="card-action share-card" title="Compartir enlace" aria-label="Compartir enlace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4M8.6 13.3l6.8 4"/></svg></button><button class="card-action download-card" title="Descargar imagen" aria-label="Descargar imagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"/></svg></button></div>';card.onclick=async e=>{const tag=e.target.closest("[data-d]");if(tag){selectedDisc=tag.dataset.d;quick.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.disc===selectedDisc));render();syncURL();return}if(e.target.closest(".share-card")){await shareGrade(g);return}if(e.target.closest(".download-card")){await downloadCard(card,g)}};results.appendChild(card)}empty.hidden=gs.length!==0}
function syncURL(extraGrade){const p=new URLSearchParams();const grade=extraGrade||selectedGrade;if(grade)p.set("grado",slug(grade));if(selectedDay)p.set("dia",slug(selectedDay));if(selectedDisc)p.set("disciplina",slug(selectedDisc));const u=location.pathname+(p.toString()?"?"+p:"");history.replaceState(null,"",u)}
function urlForGrade(g){const u=new URL(location.href);const p=new URLSearchParams();p.set("grado",slug(g));if(selectedDay)p.set("dia",slug(selectedDay));if(selectedDisc)p.set("disciplina",slug(selectedDisc));u.search=p.toString();return u.href}
async function shareGrade(g){const url=urlForGrade(g);try{if(navigator.share)await navigator.share({title:"Horario · "+g,url});else{await navigator.clipboard.writeText(url);alert("Enlace copiado")}}catch(e){}}
async function downloadCard(card,g){
  const actions=card.querySelector(".card-actions");actions.style.display="none";
  try{
    const scale=2,w=Math.max(320,Math.ceil(card.scrollWidth)),side=14,top=72,bottom=14;
    const visible=DATA.filter(r=>r.grade===g&&(!selectedDay||r.day===selectedDay)&&(!selectedDisc||r.disciplines.includes(selectedDisc)));
    const byDay=new Map();for(const r of visible){if(!byDay.has(r.day))byDay.set(r.day,new Set());r.disciplines.forEach(d=>byDay.get(r.day).add(d))}
    const days=[...byDay.keys()].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));
    const measure=document.createElement("canvas").getContext("2d");measure.font="14px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    let contentH=48;
    for(const day of days){contentH+=40;let x=side;for(const d of [...byDay.get(day)].sort((a,b)=>a.localeCompare(b,"es"))){const ww=measure.measureText(d).width+18;if(x+ww>w-side){x=side;contentH+=36}x+=ww+8}contentH+=42}
    const h=top+contentH+bottom;
    const canvas=document.createElement("canvas");canvas.width=w*scale;canvas.height=h*scale;const ctx=canvas.getContext("2d");ctx.scale(scale,scale);
    ctx.fillStyle="#0e0f13";ctx.fillRect(0,0,w,h);
    ctx.font="700 17px system-ui,-apple-system,Segoe UI,Roboto,Arial";ctx.fillStyle="#e7e9ee";ctx.fillText(g,side,top+20);
    let y=top+40;ctx.font="14px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    const pill=(txt,x,Y,bg,border,fg)=>{const tw=ctx.measureText(txt).width,ww=tw+18;ctx.fillStyle=bg;ctx.strokeStyle=border;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,Y,ww,28,10);ctx.fill();ctx.stroke();ctx.fillStyle=fg;ctx.fillText(txt,x+9,Y+19);return ww};
    for(const day of days){pill(day,side,y,"#10121a","#24262e","#c9ced8");y+=40;let x=side;for(const d of [...byDay.get(day)].sort((a,b)=>a.localeCompare(b,"es"))){const ww=ctx.measureText(d).width+18;if(x+ww>w-side){x=side;y+=36}pill(d,x,y,"#e91b2c","#e91b2c","#fff");x+=ww+8}y+=42}
    
    const png=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error("PNG")),"image/png"));const a=document.createElement("a");a.href=URL.createObjectURL(png);a.download="horario-"+slug(g)+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){console.error(e);alert("No se pudo generar la imagen. Intenta actualizar la página.")}finally{actions.style.display=""}
}
(function(){const p=new URLSearchParams(location.search);selectedGrade=fromSlug(p.get("grado")||"",GRADE_ORDER);selectedDay=fromSlug(p.get("dia")||"",DAY_ORDER);selectedDisc=fromSlug(p.get("disciplina")||"",disciplines);quickGrades.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",selectedGrade?b.dataset.grade===selectedGrade:b.dataset.grade==="Todos"));quick.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.disc===selectedDisc));if(selectedDay)quickDays.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.day===selectedDay));else{const t=getTodayName();if(!location.search&&DAY_ORDER.includes(t)){selectedDay=t;quickDays.querySelector('[data-day="Hoy"]').classList.add("active")}else quickDays.querySelector('[data-day="Todos"]').classList.add("active")}render();if(!location.search&&selectedDay)syncURL()})();
</script></body></html>
