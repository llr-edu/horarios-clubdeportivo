      for(const d of [...byDay.get(day)].sort((a,b)=>a.localeCompare(b,"es"))){
        const ww=ctx.measureText(d).width+18;
        if(x+ww>w-side){x=side;y+=36}
        pill(d,x,y,exportBrand,exportBrand,"#fff");
        x+=ww+8;
      }
      y+=42;
    }

    // Banner inferior institucional: mitad negro, mitad rojo
    const bannerY=h-bannerH;
    ctx.fillStyle="#111111";ctx.fillRect(0,bannerY,w/2,bannerH);
    ctx.fillStyle=exportBrand;ctx.fillRect(w/2,bannerY,w/2,bannerH);

    const png=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error("PNG")),"image/png"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(png);
    a.download="horario-"+slug(g)+".png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){
    console.error(e);
    alert("No se pudo generar la imagen. Intenta actualizar la página.");
  }finally{
    actions.style.display="";
  }
}
