  let options,current;
  if(type==="disc"){options=["",...disciplines];current=selectedDisc}
  else if(type==="grade"){options=["",...GRADE_ORDER];current=selectedGrade}
  else{options=["",...DAY_ORDER];current=selectedDay}
  let i=options.indexOf(current);
  if(i<0)i=0;
  const value=options[(i+direction+options.length)%options.length];
  if(type==="disc")selectedDisc=value;
  else if(type==="grade")selectedGrade=value;
  else selectedDay=value;
  syncFilterChips();
  render();
  syncURL();
  animateFilterSummary(summary,direction);
}
function enableSummaryScroller(summary,type){
  summary.title="Desliza o usa la rueda para cambiar";
  let wheelLock=0,touchStartY=0,touchStartX=0,touchMoved=false;
  summary.addEventListener("wheel",e=>{
    if(Math.abs(e.deltaY)<6||Math.abs(e.deltaY)<Math.abs(e.deltaX))return;
    e.preventDefault();
    e.stopPropagation();
    const now=Date.now();
    if(now<wheelLock)return;
    wheelLock=now+220;
    stepCompactFilter(type,e.deltaY<0?1:-1,summary);
  },{passive:false});
  summary.addEventListener("touchstart",e=>{
    const t=e.touches[0];
    touchStartY=t.clientY;touchStartX=t.clientX;touchMoved=false;
  },{passive:true});
  summary.addEventListener("touchmove",e=>{
    const t=e.touches[0],dy=t.clientY-touchStartY,dx=t.clientX-touchStartX;
    if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){
      touchMoved=true;
      e.preventDefault();
      if(Math.abs(dy)>=24){
        stepCompactFilter(type,dy<0?1:-1,summary);
        touchStartY=t.clientY;
        touchStartX=t.clientX;
      }
    }
  },{passive:false});
  summary.addEventListener("touchend",()=>{
    if(touchMoved)suppressFilterHeadClickUntil=Date.now()+120;
  },{passive:true});
}

function render(){updateFilterSummaries();const q=normal(textInput.value),filtered=DATA.filter(r=>(!selectedDay||r.day===selectedDay)&&(!selectedGrade||r.grade===selectedGrade)&&(!selectedDisc||r.disciplines.includes(selectedDisc))&&(!q||normal(r.day+" "+r.grade+" "+r.type+" "+r.disciplines.join(" ")).includes(q)));const groups=new Map();for(const r of filtered){if(!groups.has(r.grade))groups.set(r.grade,new Map());const bd=groups.get(r.grade);if(!bd.has(r.day))bd.set(r.day,new Set());r.disciplines.forEach(d=>bd.get(r.day).add(d))}results.innerHTML="";const gs=[...groups.keys()].sort((a,b)=>GRADE_ORDER.indexOf(a)-GRADE_ORDER.indexOf(b));for(const g of gs){const bd=groups.get(g),days=[...bd.keys()].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b)),card=document.createElement("article");card.className="card";card.dataset.grade=g;card.innerHTML="<h3>"+g+"</h3>"+days.map(day=>'<div class="meta"><span class="pill">'+day+'</span></div><div class="list">'+[...bd.get(day)].sort((a,b)=>a.localeCompare(b,"es")).map(d=>'<button class="tag" data-d="'+d+'">'+d+'</button>').join("")+"</div>").join("")+'<div class="card-actions"><button class="card-action share-card" title="Compartir enlace" aria-label="Compartir enlace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4M8.6 13.3l6.8 4"/></svg></button><button class="card-action download-card" title="Descargar imagen" aria-label="Descargar imagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"/></svg></button></div>';card.onclick=async e=>{const tag=e.target.closest("[data-d]");if(tag){selectedDisc=tag.dataset.d;quick.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.disc===selectedDisc));render();syncURL();return}if(e.target.closest(".share-card")){await shareGrade(g);return}if(e.target.closest(".download-card")){await downloadCard(card,g)}};results.appendChild(card)}empty.hidden=gs.length!==0}
function syncURL(extraGrade){const p=new URLSearchParams();const grade=extraGrade||selectedGrade;if(grade)p.set("grado",slug(grade));if(selectedDay)p.set("dia",slug(selectedDay));if(selectedDisc)p.set("disciplina",slug(selectedDisc));const u=location.pathname+(p.toString()?"?"+p:"");history.replaceState(null,"",u)}

function copyLink(url){let copied=false;try{const t=document.createElement("textarea");t.value=url;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();t.setSelectionRange(0,t.value.length);copied=document.execCommand("copy");t.remove()}catch(e){}if(copied){showToast("Enlace copiado");return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>showToast("Enlace copiado")).catch(()=>{})}}

async function downloadCard(card,g){
  const actions=card.querySelector(".card-actions");actions.style.display="none";
  try{
    const scale=2,w=Math.max(320,Math.ceil(card.scrollWidth)),side=14;
    const headerH=76,gradeBlockH=48,bottomPad=14,bannerH=18;
    const css=getComputedStyle(document.documentElement),cv=(name,fallback)=>css.getPropertyValue(name).trim()||fallback;
    const exportBg=cv("--surface","#0e0f13"),exportText=cv("--text","#e7e9ee"),exportMuted=cv("--muted","#8f95a3"),exportEdge=cv("--edge","#24262e"),exportControl=cv("--control2","#10121a"),exportSecondary=cv("--secondary","#c9ced8"),exportBrand=cv("--brand","#e91b2c");

    const visible=DATA.filter(r=>r.grade===g&&(!selectedDay||r.day===selectedDay)&&(!selectedDisc||r.disciplines.includes(selectedDisc)));
    const byDay=new Map();
    for(const r of visible){
      if(!byDay.has(r.day))byDay.set(r.day,new Set());
      r.disciplines.forEach(d=>byDay.get(r.day).add(d));
    }
    const days=[...byDay.keys()].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));

    const measure=document.createElement("canvas").getContext("2d");
    measure.font="14px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    let contentH=0;
    for(const day of days){
      contentH+=40;
      let x=side;
      for(const d of [...byDay.get(day)].sort((a,b)=>a.localeCompare(b,"es"))){
        const ww=measure.measureText(d).width+18;
        if(x+ww>w-side){x=side;contentH+=36}
        x+=ww+8;
      }
      contentH+=42;
    }

    const h=headerH+gradeBlockH+contentH+bottomPad+bannerH;
    const canvas=document.createElement("canvas");
    canvas.width=w*scale;canvas.height=h*scale;
    const ctx=canvas.getContext("2d");ctx.scale(scale,scale);

    ctx.fillStyle=exportBg;ctx.fillRect(0,0,w,h);

    const logoImg=new Image();
    logoImg.src=new URL("assets/logo-los-robles.png",location.href).href;
    await new Promise((ok,no)=>{if(logoImg.complete&&logoImg.naturalWidth)ok();else{logoImg.onload=ok;logoImg.onerror=no}});

    // Encabezado institucional
    ctx.drawImage(logoImg,side,10,36,44);
    ctx.fillStyle=exportText;
    ctx.font="700 15px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    ctx.fillText("Club Deportivo",58,25);
    ctx.fillText("LL. RR. · 2026",58,43);
    ctx.fillStyle=exportMuted;
    ctx.font="12px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    ctx.fillText("Horarios de Deporte, Música y Ciencias",side,65);

    // Grado/año centrado
    const gradeY=headerH+22;
    ctx.fillStyle=exportText;
    ctx.font="700 18px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    ctx.textAlign="center";
    ctx.fillText(g,w/2,gradeY);
    ctx.textAlign="left";

    // Línea roja de extremo a extremo
    const dividerY=headerH+gradeBlockH-4;
    ctx.fillStyle=exportBrand;
    ctx.fillRect(0,dividerY,w,3);

    let y=headerH+gradeBlockH+14;
    ctx.font="14px system-ui,-apple-system,Segoe UI,Roboto,Arial";
    const pill=(txt,x,Y,bg,border,fg)=>{
      const tw=ctx.measureText(txt).width,ww=tw+18;
      ctx.fillStyle=bg;ctx.strokeStyle=border;ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(x,Y,ww,28,10);ctx.fill();ctx.stroke();
      ctx.fillStyle=fg;ctx.fillText(txt,x+9,Y+19);
      return ww;
    };

    for(const day of days){
      pill(day,side,y,exportControl,exportEdge,exportSecondary);
      y+=40;
      let x=side;
      for(const d of [...byDay.get(day)].sort((a,b)=>a.localeCompare(b,"es"))){
        const ww=ctx.measureText(d).width+18;
        if(x+ww>w-side){x=side;y+=36}
        pill(d,x,y,exportBrand,exportBrand,"#fff");
        x+=ww+8;
      }
      y+=42;
    }

    // Banner inferior institucional: mitad negro, mitad rojo
    const bannerY=h-bannerH;
    ctx.fillStyle="#111111";ctx.fillRect(0,bannerY,w/2,bannerH);
    ctx.fillStyle=exportBrand;ctx.fillRect(w/2,bannerY,w/2,bannerH);

    const png=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error("PNG")),"image/png"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(png);
    a.download="horario-"+slug(g)+".png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){
    console.error(e);
    alert("No se pudo generar la imagen. Intenta actualizar la página.");
  }finally{
    actions.style.display="";
  }
}
