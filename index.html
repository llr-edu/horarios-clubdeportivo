<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horarios Club Deportivo, Música y Ciencias — LL. RR. 2026-2027</title>
<style>
:root{--bg:#0b0b0c;--panel:#131317;--muted:#8f95a3;--edge:#24262e;--brand:#e91b2c}*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#0b0b0c,#151518 42%,#101013);color:#e7e9ee}.wrap{max-width:1100px;margin:auto;padding:24px}header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:14px;align-items:center;min-width:0}.badge{background:var(--brand);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;letter-spacing:.2px;white-space:nowrap;font-size:.88rem}.headcopy{min-width:0}h1{font-size:clamp(20px,2.2vw,28px);margin:0;line-height:1.15}.sub{color:var(--muted);font-size:.95rem;margin-top:4px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:14px}.filters{display:grid;grid-template-columns:1fr;gap:12px}label{display:block;font-size:.8rem;color:var(--muted);margin:6px 2px}input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:#0f1014;color:#e7e9ee}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{border:1px solid var(--edge);padding:6px 10px;border-radius:999px;font-size:.85rem;color:#d6dae3;background:#0e0f12;cursor:pointer}.chip.active{background:var(--brand);border-color:transparent;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:14px 12px}header{display:grid;grid-template-columns:1fr auto;gap:10px 8px;align-items:start}.brand{grid-column:1/-1;display:block}.badge{display:inline-flex;padding:6px 11px;font-size:.78rem;margin-bottom:9px}.headcopy{display:block}h1{font-size:1.42rem;line-height:1.08;max-width:330px}.sub{font-size:.86rem;line-height:1.3;max-width:340px}.btn{grid-column:2;grid-row:1;position:absolute;right:12px;top:14px;padding:7px 10px;font-size:.78rem;border-radius:10px}.panel{padding:12px}.chips{gap:6px}.chip{font-size:.8rem;padding:6px 9px}}.card{background:#0e0f13;border:1px solid var(--edge);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}.card h3{margin:0;font-size:1.05rem}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#c9ced8;font-size:.9rem}.pill{background:#10121a;border:1px solid var(--edge);border-radius:999px;padding:4px 8px}.list{display:flex;flex-wrap:wrap;gap:8px}.tag{background:var(--brand);border:1px solid var(--brand);border-radius:10px;padding:5px 8px;font-size:.85rem;color:#fff;cursor:pointer}.empty{opacity:.75;text-align:center;padding:28px}.hint{color:#b5bac7;font-size:.9rem;margin-top:4px}.footer{margin:24px 4px;color:#9aa2b3}.btn{appearance:none;border:1px solid var(--edge);background:#0f1116;color:#e7e9ee;border-radius:12px;padding:10px 12px;cursor:pointer}
</style></head><body><div class="wrap">
<header><div class="brand"><div class="badge">LL. RR. · 2026–2027</div><div class="headcopy"><h1>Horarios · Club Deportivo, Música y Ciencias</h1><div class="sub">Busca o filtra por disciplina, grado/año y día.</div></div></div><button class="btn" id="reset">Reiniciar</button></header>
<section class="panel"><div class="filters"><div><label for="text">Búsqueda rápida</label><input id="text" placeholder="Escribe: violín, robótica, 3er, futsal…"></div></div><div class="chips" id="quick"></div><div class="chips" id="quickGrades"></div><div class="chips" id="quickDays"></div></section>
<section id="results" class="grid" aria-live="polite"></section><div id="empty" class="empty" hidden>Sin coincidencias con los filtros actuales.</div>
<div class="footer"><div class="hint">Haz clic en una disciplina, un grado/año o un día para filtrar al instante.</div></div></div>
<script>
const normal=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const DAY_ORDER=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const GRADE_ORDER=["1er Grado","2do Grado","3er Grado","4to Grado","5to Grado","6to Grado","1er Año","2do Año","3er Año","4to Año","5to Año"];
const getTodayName=()=>["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()];
const DATA=[];function add(day,grades,disciplines,type="Deporte"){for(const grade of grades)DATA.push({day,grade,disciplines:[...disciplines],type});}
const G1="1er Grado",G2="2do Grado",G3="3er Grado",G4="4to Grado",G5="5to Grado",G6="6to Grado",A1="1er Año",A2="2do Año",A3="3er Año",A4="4to Año",A5="5to Año";
add("Lunes",[G1,G2],["Béisbol","Futsal"]);add("Lunes",[G3,G4],["Ajedrez","Tenis"]);add("Lunes",[G5,G6],["Atletismo"]);add("Martes",[G1,G2],["Baloncesto"]);add("Martes",[G3,G4],["Béisbol","Futsal"]);add("Martes",[G5,G6],["Ajedrez","Tenis"]);add("Miércoles",[G1,G2],["Atletismo","Ajedrez"]);add("Miércoles",[G3,G4],["Fútbol campo"]);add("Miércoles",[G5,G6],["Béisbol","Futsal"]);add("Jueves",[G1,G2],["Fútbol campo"]);add("Jueves",[G3,G4],["Atletismo"]);add("Jueves",[G5,G6],["Baloncesto"]);add("Viernes",[G1,G2],["Tenis"]);add("Viernes",[G3,G4],["Baloncesto"]);add("Viernes",[G5,G6],["Fútbol campo"]);add("Sábado",[G1,G2,G3,G4,G5,G6],["Encuentros deportivos"]);
add("Lunes",[A1,A2],["Baloncesto","Voleibol"]);add("Lunes",[A3,A4,A5],["Fútbol campo"]);add("Martes",[A1,A2],["Atletismo","Fútbol campo"]);add("Martes",[A3,A4,A5],["Voleibol"]);add("Miércoles",[A1,A2],["Tenis"]);add("Miércoles",[A3,A4,A5],["Baloncesto"]);add("Jueves",[A1,A2],["Futsal","Ajedrez"]);add("Jueves",[A3,A4,A5],["Béisbol","Voleibol","Tenis"]);add("Viernes",[A1,A2],["Béisbol"]);add("Viernes",[A3,A4,A5],["Atletismo","Futsal","Ajedrez"]);add("Sábado",[A1,A2,A3,A4,A5],["Encuentros deportivos"]);
add("Lunes",[G1,G2],["Iniciación Musical"],"Música");add("Martes",[G3,G4],["Violín"],"Música");add("Miércoles",[G5,G6],["Violín","Percusión"],"Música");add("Martes",[G5,G6],["Cuatro","Gaita"],"Música");add("Jueves",[G1,G2,G3,G4],["Gaita"],"Música");add("Martes",[G3,G4,G5,G6],["Teclado"],"Música");add("Jueves",[G5,G6],["Guitarra Acústica"],"Música");add("Viernes",[G1,G2,G3,G4,G5,G6],["Batería","Cuatro","Bajo Eléctrico","Guitarra","Ensamble Musical"],"Música");add("Martes",[G1,G2],["Astronomía"],"Ciencias");add("Miércoles",[G3,G4],["Astronomía"],"Ciencias");add("Jueves",[G5,G6],["Astronomía"],"Ciencias");add("Lunes",[G1,G2],["Robótica"],"Ciencias");add("Martes",[G3,G4],["Robótica"],"Ciencias");add("Miércoles",[G5,G6],["Robótica"],"Ciencias");
add("Jueves",[A1,A2],["Violín"],"Música");add("Viernes",[A3,A4,A5],["Violín"],"Música");add("Miércoles",[A1,A2,A3,A4,A5],["Percusión"],"Música");add("Martes",[A1,A2,A3,A4,A5],["Gaita"],"Música");add("Viernes",[A1,A2,A3,A4,A5],["Teclado","Guitarra Eléctrica","Bajo Eléctrico","Ensamble Musical"],"Música");add("Jueves",[A1,A2,A3,A4,A5],["Guitarra Acústica"],"Música");add("Lunes",[A1,A2],["Astronomía"],"Ciencias");add("Viernes",[A3,A4,A5],["Astronomía"],"Ciencias");add("Jueves",[A1,A2],["Robótica"],"Ciencias");add("Viernes",[A3,A4,A5],["Robótica"],"Ciencias");
let selectedDay="",selectedGrade="",selectedDisc="";const $=s=>document.querySelector(s),results=$("#results"),empty=$("#empty"),textInput=$("#text"),quick=$("#quick"),quickGrades=$("#quickGrades"),quickDays=$("#quickDays");
const disciplines=[...new Set(DATA.flatMap(r=>r.disciplines))].sort((a,b)=>a.localeCompare(b,"es"));quick.innerHTML=disciplines.map(d=>'<button class="chip" data-disc="'+d+'">'+d+'</button>').join("");quickGrades.innerHTML=["Todos",...GRADE_ORDER].map(g=>'<button class="chip" data-grade="'+g+'">'+g+'</button>').join("");quickDays.innerHTML=["Todos","Hoy",...DAY_ORDER].map(d=>'<button class="chip" data-day="'+d+'">'+d+'</button>').join("");
quick.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const on=!b.classList.contains("active");quick.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));selectedDisc=on?b.dataset.disc:"";if(on)b.classList.add("active");render()};quickGrades.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const on=!b.classList.contains("active"),v=b.dataset.grade;quickGrades.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));selectedGrade=(v==="Todos"||!on)?"":v;if(on)b.classList.add("active");render()};quickDays.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const on=!b.classList.contains("active"),v=b.dataset.day;quickDays.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));if(v==="Hoy"&&on){const t=getTodayName();selectedDay=DAY_ORDER.includes(t)?t:"";b.classList.add("active")}else{selectedDay=(v==="Todos"||!on)?"":v;if(on)b.classList.add("active")}render()};textInput.oninput=render;$("#reset").onclick=()=>{selectedDay=selectedGrade=selectedDisc="";textInput.value="";document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));quickGrades.querySelector('[data-grade="Todos"]').classList.add("active");quickDays.querySelector('[data-day="Todos"]').classList.add("active");render()};
function render(){const q=normal(textInput.value),filtered=DATA.filter(r=>(!selectedDay||r.day===selectedDay)&&(!selectedGrade||r.grade===selectedGrade)&&(!selectedDisc||r.disciplines.includes(selectedDisc))&&(!q||normal(r.day+" "+r.grade+" "+r.type+" "+r.disciplines.join(" ")).includes(q)));const groups=new Map();for(const r of filtered){if(!groups.has(r.grade))groups.set(r.grade,new Map());const bd=groups.get(r.grade);if(!bd.has(r.day))bd.set(r.day,new Set());r.disciplines.forEach(d=>bd.get(r.day).add(d))}results.innerHTML="";const gs=[...groups.keys()].sort((a,b)=>GRADE_ORDER.indexOf(a)-GRADE_ORDER.indexOf(b));for(const g of gs){const bd=groups.get(g),days=[...bd.keys()].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b)),card=document.createElement("article");card.className="card";card.innerHTML="<h3>"+g+"</h3>"+days.map(day=>'<div class="meta"><span class="pill">'+day+'</span></div><div class="list">'+[...bd.get(day)].sort((a,b)=>a.localeCompare(b,"es")).map(d=>'<button class="tag" data-d="'+d+'">'+d+'</button>').join("")+"</div>").join("");card.onclick=e=>{const t=e.target.closest("[data-d]");if(!t)return;selectedDisc=t.dataset.d;quick.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.disc===selectedDisc));render()};results.appendChild(card)}empty.hidden=gs.length!==0}
(function(){quickGrades.querySelector('[data-grade="Todos"]').classList.add("active");const t=getTodayName();if(DAY_ORDER.includes(t)){quickDays.querySelector('[data-day="Hoy"]').classList.add("active");selectedDay=t}else quickDays.querySelector('[data-day="Todos"]').classList.add("active");render()})();
</script></body></html>
